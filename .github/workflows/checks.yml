name: Profile checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.2 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run check:portfolio
      - run: npm test
      - run: npm run build
      - run: npm run check:release
      - run: npm audit --audit-level=high
      - run: npm run cdk:synth:development
      - run: npm run cdk:synth:production
      - run: npm run cdk:synth:governance:development
      - run: npm run cdk:synth:governance:production
